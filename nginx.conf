server {
    listen 80;
    listen [::]:80;
    server_name otn-olympia-volkslauf.de www.otn-olympia-volkslauf.de;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name otn-olympia-volkslauf.de www.otn-olympia-volkslauf.de;

    # SSL – Pfade ggf. anpassen (z. B. Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/otn-olympia-volkslauf.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otn-olympia-volkslauf.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/otn-olympia-volkslauf.de/dist;
    index index.html;

    # Security-Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # script-src erlaubt zusätzlich die Hashes der inline JSON-LD-Blöcke in index.html
    # (SportsEvent- und FAQPage-Schema) — bei Änderung eines JSON-LD-Inhalts muss dessen Hash neu berechnet werden.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-hAht6WjJ1s1Zh/SMYQOtCPhlCIE2D5w7Ts9Xnc4nq4c=' 'sha256-MSkr6m3cGA3N5y6wItMly+8DZw2tmtSGJBMVtnjsHXU='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src https://maps.google.com https://www.google.com https://my.raceresult.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Gzip-Komprimierung
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;

    # Hashed Vite-Assets → 1 Jahr Cache (immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Bilder → 1 Jahr Cache
    location /images/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon → 1 Tag Cache
    location = /favicon.svg {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML → kein Cache (damit neue Deployments sofort wirken)
    location ~* \.html$ {
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # API → Node-Server (Kontaktformular, Newsletter, Intern-Auth)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-Fallback: alle Routen auf index.html zeigen
    location / {
        try_files $uri $uri/ /index.html;
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
