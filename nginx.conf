server {
    listen 80;
    listen [::]:80;
    server_name otn-olympia-volkslauf.de www.otn-olympia-volkslauf.de;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name otn-olympia-volkslauf.de www.otn-olympia-volkslauf.de;

    # SSL – Pfade ggf. anpassen (z. B. Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/otn-olympia-volkslauf.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otn-olympia-volkslauf.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/otn-olympia-volkslauf.de/dist;
    index index.html;

    # Gzip-Komprimierung
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml font/woff font/woff2;
    gzip_min_length 1024;

    # Hashed Vite-Assets → 1 Jahr Cache (immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Bilder → 1 Jahr Cache
    location /images/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon → 1 Tag Cache
    location = /favicon.svg {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML → kein Cache (damit neue Deployments sofort wirken)
    location ~* \.html$ {
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # SPA-Fallback: alle Routen auf index.html zeigen
    location / {
        try_files $uri $uri/ /index.html;
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
